<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>مَن يزيد؟</title>

<link rel="stylesheet" href="/css/style.css">

</head><body><!-- الخلفية العامة -->
<div class="page-background">

    <!-- الإطار الرئيسي -->
    <main class="game-frame">

        <!-- الزخارف -->
        <div class="frame-glow"></div>
        <div class="corner corner-top-right"></div>
        <div class="corner corner-top-left"></div>
        <div class="corner corner-bottom-right"></div>
        <div class="corner corner-bottom-left"></div>

        <!-- محتوى اللعبة -->
        <div class="game-content">

            <!-- الشعار -->
            <header class="game-header">
                <div class="game-logo">
                    <span class="logo-small">LIVE CHALLENGE</span>
                    <h1>مَن يزيد؟</h1>
                </div>
            </header>

            <!-- المؤقت -->
            <section class="timer-area">
                <div class="timer-label">الوقت</div>
                <div class="timer">15</div>
            </section>

            <!-- السؤال -->
            <section class="question-area">

                <div class="question-label">
                    السؤال
                </div>

                <h2>
                    كم دولة تستطيع ذكرها تقع في قارة آسيا؟
                </h2>

            </section>

            <!-- منطقة المزايدات -->
            <section class="bids-area">

                <div class="section-title">
                    المزايدات
                </div>

                <div class="bids-list">

                    <div class="bid-player">
                        <div class="player-avatar">
                            👤
                        </div>

                        <div class="player-info">
                            <strong>سامي</strong>
                            <span>يزيد إلى</span>
                        </div>

                        <div class="bid-number">
                            8
                        </div>
                    </div>


                    <div class="bid-player">
                        <div class="player-avatar">
                            👤
                        </div>

                        <div class="player-info">
                            <strong>محمد</strong>
                            <span>يزيد إلى</span>
                        </div>

                        <div class="bid-number">
                            12
                        </div>
                    </div>


                    <div class="bid-player active">
                        <div class="player-avatar">
                            👤
                        </div>

                        <div class="player-info">
                            <strong>أحمد</strong>
                            <span>يزيد إلى</span>
                        </div>

                        <div class="bid-number">
                            15
                        </div>
                    </div>

                </div>

            </section>

            <!-- منطقة الحالة -->
            <section class="status-area">
                <span class="status-dot"></span>
                <span>بانتظار المزايدات...</span>
            </section>

            <!-- التحكم -->
            <footer class="game-controls">

                <button class="main-button">
                    ابدأ الجولة
                </button>

            </footer>

        </div>

    </main>

</div>

<script src="/js/app.js"></script>

</body>
  </html>
